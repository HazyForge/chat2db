helmChartPath: charts/chat2db

image:
  repository: ghcr.io/hazyforge/chat2db
  tag: sha-aa50a18
  digest: sha256:f30072ae0728e639a8db4fa5fb8e6a94863b0906efdc9cc80a72cdd113382989
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds

persistence:
  storageClassName: observability-local
  accessModes:
    - ReadWriteOnce
  size: 10Gi

encryptionKey:
  existingSecret: chat2db-encryption-key
  secretKey: encryption.key
  mountPath: /run/secrets/chat2db-community-encryption.key

cors:
  allowedOrigin: https://chat2db.hazyforge.io

ai:
  openai:
    existingSecret: chat2db-openai-proxy
    secretKey: api-key
    baseUrl: https://codex.hazycloud.io
    models:
      - gpt-5.4

datasourceBootstrap:
  enabled: true
  rolloutRevision: "1"
  managementKey: hazytrade-production-readonly
  alias: Hazy Trade Production (read only)
  type: POSTGRESQL
  host: 5.161.253.191
  port: 5432
  database: hazytrade
  user: chat2db_hazytrade_ro
  authenticationType: "1"
  environmentId: 2
  sslMode: verify-full
  existingSecret: chat2db-hazytrade-datasource
  passwordKey: password
  caKey: ca.crt

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector:
  kubernetes.io/hostname: z400

networkPolicy:
  enabled: true
  allowedIngress:
    namespace: oauth2-proxy
    podLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: chat2db
