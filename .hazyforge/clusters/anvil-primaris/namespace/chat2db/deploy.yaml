helmChartPath: charts/chat2db

image:
  repository: ghcr.io/hazyforge/chat2db
  tag: sha-7608df4
  digest: sha256:5154a4c8546408c5faf621705c94eb45ff0eaa014955f13e2cba79fb878d4ea2
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-creds

persistence:
  storageClassName: observability-local
  accessModes:
    - ReadWriteOnce
  size: 10Gi

encryptionKey:
  existingSecret: chat2db-encryption-key
  secretKey: encryption.key
  mountPath: /run/secrets/chat2db-community-encryption.key

cors:
  allowedOrigin: https://chat2db.hazyforge.io

ai:
  openai:
    existingSecret: chat2db-openai-proxy
    secretKey: api-key
    baseUrl: https://codex.hazycloud.io
    models:
      - gpt-5.4

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector:
  kubernetes.io/hostname: z400

networkPolicy:
  enabled: true
  allowedIngress:
    namespace: oauth2-proxy
    podLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: chat2db
