replicaCount: 1

image:
  repository: ghcr.io/hazyforge/chat2db
  tag: main
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
automountServiceAccountToken: false

service:
  port: 10825

cors:
  allowedOrigin: ""

ai:
  openai:
    existingSecret: ""
    secretKey: api-key
    baseUrl: ""
    models: []

persistence:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

encryptionKey:
  existingSecret: chat2db-encryption-key
  secretKey: encryption.key
  mountPath: /run/secrets/chat2db-community-encryption.key

# Optional, controller-owned PostgreSQL datasource reconciled at application
# startup. Credentials and the trust root must come from an existing Secret.
datasourceBootstrap:
  enabled: false
  managementKey: ""
  alias: ""
  type: POSTGRESQL
  host: ""
  port: 5432
  database: ""
  user: ""
  authenticationType: "1"
  environmentId: 2
  sslMode: verify-full
  existingSecret: ""
  passwordKey: password
  caKey: ca.crt
  passwordMountPath: /run/secrets/chat2db-datasource/password
  caMountPath: /run/secrets/chat2db-datasource/ca.crt

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  # Keep empty for default-deny ingress. A protected hosted deployment should
  # name its central oauth2-proxy namespace and exact proxy workload labels.
  allowedIngress: null
