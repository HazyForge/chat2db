{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chat2db.fullname" . }}-ingress
  labels:
    {{- include "chat2db.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chat2db.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- with .Values.networkPolicy.allowedIngress }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 10825
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
