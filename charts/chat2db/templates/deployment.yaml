apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chat2db.fullname" . }}
  labels:
    {{- include "chat2db.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chat2db.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chat2db.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chat2db
          image: {{ include "chat2db.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CHAT2DB_COMMUNITY_ENCRYPTION_KEY_FILE
              value: {{ .Values.encryptionKey.mountPath | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
            {{- if .Values.datasourceBootstrap.enabled }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_ENABLED
              value: "true"
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_MANAGEMENT_KEY
              value: {{ required "datasourceBootstrap.managementKey is required when datasource bootstrap is enabled" .Values.datasourceBootstrap.managementKey | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_ALIAS
              value: {{ required "datasourceBootstrap.alias is required when datasource bootstrap is enabled" .Values.datasourceBootstrap.alias | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_TYPE
              value: {{ required "datasourceBootstrap.type is required when datasource bootstrap is enabled" .Values.datasourceBootstrap.type | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_HOST
              value: {{ required "datasourceBootstrap.host is required when datasource bootstrap is enabled" .Values.datasourceBootstrap.host | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_PORT
              value: {{ .Values.datasourceBootstrap.port | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_DATABASE
              value: {{ required "datasourceBootstrap.database is required when datasource bootstrap is enabled" .Values.datasourceBootstrap.database | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_USER
              value: {{ required "datasourceBootstrap.user is required when datasource bootstrap is enabled" .Values.datasourceBootstrap.user | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_AUTHENTICATION_TYPE
              value: {{ .Values.datasourceBootstrap.authenticationType | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_ENVIRONMENT_ID
              value: {{ .Values.datasourceBootstrap.environmentId | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_SSL_MODE
              value: {{ .Values.datasourceBootstrap.sslMode | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_PASSWORD_FILE
              value: {{ .Values.datasourceBootstrap.passwordMountPath | quote }}
            - name: CHAT2DB_BOOTSTRAP_DATASOURCE_CA_FILE
              value: {{ .Values.datasourceBootstrap.caMountPath | quote }}
            {{- end }}
            {{- with .Values.cors.allowedOrigin }}
            - name: CHAT2DB_WEB_CORS_ALLOWED_ORIGIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ai.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.ai.openai.secretKey | quote }}
            {{- end }}
            {{- with .Values.ai.openai.baseUrl }}
            - name: OPENAI_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.ai.openai.models }}
            - name: CHAT2DB_OPENAI_MODELS
              value: {{ join "," . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 10825
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/system
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: encryption-key
              mountPath: {{ .Values.encryptionKey.mountPath | quote }}
              subPath: {{ .Values.encryptionKey.secretKey | quote }}
              readOnly: true
            {{- if .Values.datasourceBootstrap.enabled }}
            - name: datasource-bootstrap
              mountPath: {{ .Values.datasourceBootstrap.passwordMountPath | quote }}
              subPath: password
              readOnly: true
            - name: datasource-bootstrap
              mountPath: {{ .Values.datasourceBootstrap.caMountPath | quote }}
              subPath: ca.crt
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "chat2db.fullname" . }}
        - name: encryption-key
          secret:
            secretName: {{ .Values.encryptionKey.existingSecret }}
            defaultMode: 0440
        {{- if .Values.datasourceBootstrap.enabled }}
        - name: datasource-bootstrap
          secret:
            secretName: {{ required "datasourceBootstrap.existingSecret is required when datasource bootstrap is enabled" .Values.datasourceBootstrap.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.datasourceBootstrap.passwordKey | quote }}
                path: password
              - key: {{ .Values.datasourceBootstrap.caKey | quote }}
                path: ca.crt
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
