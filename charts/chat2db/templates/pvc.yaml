apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chat2db.fullname" . }}
  annotations:
    # Chat2DB keeps its complete workspace, encrypted datasource credentials,
    # drivers, and history here. Preserve the claim across GitOps app removal.
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
  labels:
    {{- include "chat2db.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
